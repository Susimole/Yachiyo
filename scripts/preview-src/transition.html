<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>八千代 · 站坐过渡方案对比</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1b1a1e; --dim:#6b7280;
    --line:#e3e5e9; --accent:#0A7EA4; --accent2:#c2410c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:28px 32px 40px; background:var(--bg); color:var(--ink);
    font:14px/1.6 "Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  }
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}

  /* ---- 控制条 ---- */
  .bar{
    display:flex;flex-wrap:wrap;gap:22px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:14px 18px;margin-bottom:24px;
  }
  .bar label{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--dim)}
  input[type=range]{width:190px;accent-color:var(--accent)}
  .val{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;min-width:52px}
  button{
    font:inherit;font-size:13px;padding:7px 15px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink);
  }
  button:hover{border-color:#c8ccd2}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---- 四格 ---- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:1560px}
  @media (max-width:1300px){ .grid{grid-template-columns:repeat(2,1fr)} }

  .cell{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;display:flex;flex-direction:column;
  }
  .cell .hd{padding:11px 15px 9px;border-bottom:1px solid var(--line)}
  .cell .nm{font-weight:700;font-size:14px}
  .cell .ds{color:var(--dim);font-size:12px;margin-top:2px;min-height:34px}
  .cell.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(10,126,164,.18)}
  .cell.on .nm{color:var(--accent)}

  /* 舞台：两个 canvas 严格叠在一起 */
  .stage{
    position:relative;background:
      repeating-conic-gradient(#eceef1 0% 25%, #fff 0% 50%) 50%/18px 18px;
    margin:0;height:452px;
  }
  .stage canvas{
    position:absolute;left:50%;bottom:18px;transform-origin:bottom center;
    margin-left:-150px;              /* 300/2 —— 让画布水平居中 */
    will-change:opacity,transform;
  }
  /* 地面线 —— 两套的脚都该踩在这条线上 */
  .stage::after{
    content:'';position:absolute;left:14px;right:14px;bottom:17px;
    border-top:1.5px dashed #93a0ad;
  }
  .stage .tag{
    position:absolute;left:10px;top:8px;font-size:11px;color:var(--dim);
    background:rgba(255,255,255,.82);padding:1px 7px;border-radius:5px;
  }
  .legend{padding:9px 15px 13px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
  .legend b{color:var(--ink)}
</style>
</head>
<body>

<h1>八千代 · 站坐过渡 — 4 个方案</h1>
<div class="sub">
  四个格子<b>同时循环播放</b>，方便横向对比。想单独看就点格子把它选中（选中的会加粗边框）。<br>
  两套立绘的<b style="color:#c2410c">脚都对在同一条虚线上</b> —— 这是实际会用的对齐算法，不是画的示意。
</div>

<div class="bar">
  <label>过渡时长 <input type="range" id="dur" min="120" max="1200" step="20" value="420">
    <span class="val" id="durV">420ms</span></label>
  <label>停顿时长 <input type="range" id="hold" min="200" max="2500" step="50" value="900">
    <span class="val" id="holdV">900ms</span></label>
  <label>整体速度 <input type="range" id="speed" min="25" max="200" step="5" value="100">
    <span class="val" id="speedV">100%</span></label>
  <button id="pause">暂停</button>
  <button id="step">手动走一格</button>
</div>

<div class="grid" id="grid"></div>

<script>
/* ============================================================
   素材是内嵌的（base64）—— 双击就能开，不用起服务器。
   __ASSETS__ = { "side/back hair.png": "data:image/png;base64,…" }
   __RIG__    = rig.json 的内容
   ============================================================ */
const RIG = __RIG__;
const PX_PER_UNIT = 0.72;
const CANVAS_PX = RIG.canvas * PX_PER_UNIT;      // 460.8

/* ---------- 加载全部贴图 ---------- */
const IMG = {};
let pending = 0;
for (const s of Object.values(RIG.sets)) {
  for (const p of Object.values(s.parts)) {
    if (IMG[p.file] || !__ASSETS__[p.file]) continue;
    pending++;
    const im = new Image();
    im.onload = im.onerror = () => { if (--pending === 0) build(); };
    im.src = __ASSETS__[p.file];
    IMG[p.file] = im;
  }
}
if (!pending) build();

/* ---------- 把一套立绘画到画布上 ----------
   坐标口径跟真工程一致：rig.json 的拆件单位 × 0.72，
   件自己的 dx/dy 是手工微调量，要加回去。
   两套的**脚底**对齐到同一条基线 —— 这就是站坐切换时「脚不动」的做法。 */
function drawSet(ctx, setName, baselineY) {
  const set = RIG.sets[setName];
  const pad = 0;
  let foot = 0;
  for (const key of set.order) {
    const p = set.parts[key];
    if (!p) continue;
    foot = Math.max(foot, (p.y + (Number(p.dy) || 0) + p.h) * PX_PER_UNIT);
  }
  const off = baselineY - foot;

  for (const key of set.order) {
    const p = set.parts[key];
    const im = p && IMG[p.file];
    if (!im) continue;
    const x = (p.x + (Number(p.dx) || 0)) * PX_PER_UNIT;
    const y = (p.y + (Number(p.dy) || 0)) * PX_PER_UNIT;
    ctx.drawImage(im, x, y + off, p.w * PX_PER_UNIT, p.h * PX_PER_UNIT);
  }
}

/* ---------- 四个方案 ----------
   每个方案的 apply(t) 拿到 0→1 的**缓动后**进度，
   自己去摆「站立」和「坐姿」两层的不透明度 / 变形。
   两层都是同一个 div 里的 canvas，transform-origin 已经设成 bottom 了。 */
const PLANS = [
  {
    id: 'cross',
    name: 'A · 交叉淡化',
    desc: '两个姿势同时淡 —— 站立一边淡出一边被坐姿盖上来，中间没有空档。',
    legend: '最平滑，但两种姿势会在中途<b>短暂重叠</b>（能看到一点「重影」）。',
    apply(st, si, t) {
      st.style.opacity = 1 - t;
      si.style.opacity = t;
    },
  },
  {
    id: 'seq',
    name: 'B · 先淡出再淡入',
    desc: '站立先淡干净，坐姿再淡出来 —— 中间有一瞬间是空的。',
    legend: '不会有重影，但中间会<b>空一下</b>，看着像「消失又出现」。',
    apply(st, si, t) {
      st.style.opacity = t < 0.5 ? 1 - t * 2 : 0;
      si.style.opacity = t < 0.5 ? 0 : (t - 0.5) * 2;
    },
  },
  {
    id: 'squash',
    name: 'C · 挤压展开',
    desc: '站立先被「压扁」再消失，坐姿从压扁状态弹开 —— 像果冻。',
    legend: '有重量感，跟她的<b>呼吸 Q 弹</b>是同一套手感，比较像「她真的坐下了」。',
    apply(st, si, t) {
      const a = Math.min(1, t * 2.2);
      st.style.opacity = 1 - a;
      st.style.transform = `scaleY(${1 - 0.16 * a})`;
      const b = Math.max(0, (t - 0.3) / 0.7);
      si.style.opacity = b;
      si.style.transform = `scaleY(${1 - 0.16 * (1 - b)})`;
    },
  },
  {
    id: 'rise',
    name: 'D · 从下往上滑',
    desc: '坐姿从下方滑上来 + 淡入，站立同时淡出。',
    legend: '方向感最强（往下坐 = 从下出来），但<b>位移最显眼</b>，可能有点跳。',
    apply(st, si, t) {
      st.style.opacity = 1 - t;
      si.style.opacity = t;
      si.style.transform = `translateY(${(1 - t) * 46}px)`;
    },
  },
];

/* ---------- 搭台 ---------- */
const grid = document.getElementById('grid');
const cells = [];

let selected = 'all';       // 'all' = 四个一起播；否则只播那一个

for (const plan of PLANS) {
  const el = document.createElement('div');
  el.className = 'cell';
  el.innerHTML = `
    <div class="hd"><div class="nm">${plan.name}</div><div class="ds">${plan.desc}</div></div>
    <div class="stage">
      <canvas class="stand"></canvas>
      <canvas class="sit"></canvas>
      <div class="tag">点击选中单独看</div>
    </div>
    <div class="legend">${plan.legend}</div>`;

  const stage = el.querySelector('.stage');
  const cvS = el.querySelector('.stand');
  const cvSit = el.querySelector('.sit');

  for (const c of [cvS, cvSit]) {
    c.width = CANVAS_PX; c.height = CANVAS_PX;
    c.style.width = '300px'; c.style.height = '300px';
    c.getContext('2d').imageSmoothingQuality = 'high';
  }

  el.addEventListener('click', () => {
    if (selected === plan.id) { selected = 'all'; }
    else { selected = plan.id; }
    syncSelection();
  });

  cells.push({ plan, el, cvS, cvSit, stage });
  grid.appendChild(el);
}

function syncSelection() {
  for (const c of cells) c.el.classList.toggle('on', selected !== 'all' && selected === c.plan.id);
}

function paint() {
  for (const c of cells) {
    const gS = c.cvS.getContext('2d');
    const gI = c.cvSit.getContext('2d');
    gS.clearRect(0, 0, CANVAS_PX, CANVAS_PX);
    gI.clearRect(0, 0, CANVAS_PX, CANVAS_PX);
    const base = CANVAS_PX - 6;          // 脚底基线（留一点余量）
    drawSet(gS, 'side', base);
    drawSet(gI, 'sit', base);
    c.cvS.style.opacity = '1';
    c.cvSit.style.opacity = '0';
  }
}

function build() { paint(); requestAnimationFrame(loop); }

/* ---------- 时间轴 ---------- */
const $dur = document.getElementById('dur');
const $hold = document.getElementById('hold');
const $speed = document.getElementById('speed');
const $durV = document.getElementById('durV');
const $holdV = document.getElementById('holdV');
const $speedV = document.getElementById('speedV');

let paused = false;
let phase = 0;          // 0..1 在「站立 → 坐姿 → 站立」里循环
let last = performance.now();

const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

function loop(now) {
  const dt = Math.min(now - last, 100);
  last = now;

  const dur = Number($dur.value);
  const hold = Number($hold.value);
  const spd = Number($speed.value) / 100;

  if (!paused) {
    const cycle = (dur + hold) * 2;
    phase += (dt * spd) / cycle;
    if (phase >= 1) phase -= 1;
  }

  // 把 phase 拆成「进度 0→1」（前半换过去、后半换回来）
  const cyc = Math.min(phase, 0.9999) * 2;
  const half = cyc % 1;                       // 每个半程内的线性进度
  const goingSit = cyc < 1;
  const raw = goingSit ? half : 1 - half;
  const durFrac = dur / (dur + hold);
  // 每个半程：前 durFrac 用来过渡，剩下的停住
  const t = easeInOut(Math.min(1, raw / Math.max(0.02, durFrac)));

  for (const c of cells) {
    const active = selected === 'all' || selected === c.plan.id;
    if (active) {
      c.plan.apply(c.cvS, c.cvSit, t);
    } else {
      c.cvS.style.opacity = '0.25';
      c.cvSit.style.opacity = '0.25';
      c.cvS.style.transform = '';
      c.cvSit.style.transform = '';
    }
  }

  requestAnimationFrame(loop);
}

$dur.oninput = () => { $durV.textContent = $dur.value + 'ms'; };
$hold.oninput = () => { $holdV.textContent = $hold.value + 'ms'; };
$speed.oninput = () => { $speedV.textContent = $speed.value + '%'; };
$speed.oninput();

document.getElementById('pause').onclick = (e) => {
  paused = !paused;
  e.target.textContent = paused ? '继续' : '暂停';
  e.target.classList.toggle('on', paused);
};

document.getElementById('step').onclick = () => {
  paused = true;
  const btn = document.getElementById('pause');
  btn.textContent = '继续'; btn.classList.add('on');
  const dur = Number($dur.value), hold = Number($hold.value);
  phase += (dur + hold) / ((dur + hold) * 2) * 2;   // 走半个来回
  if (phase >= 1) phase -= 1;
  last = performance.now();
};
</script>
</body>
</html>
