<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>八千代 · 聊天</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./overlay.css">
</head>
<body class="light">
<div class="card">

  <div class="bar">
    <img class="ava" src="./assets/icon.ico" alt="">
    <span class="title">八千代</span>
    <span class="spacer"></span>
    <button id="cClear" title="清空记录">⌫</button>
    <button id="cClose" title="关闭">✕</button>
  </div>

  <div class="c-body scroll" id="cBody"></div>

  <div class="c-foot">
    <textarea id="cInput" rows="1" placeholder="说点什么…"></textarea>
    <button id="cSend" class="btn primary">发送</button>
  </div>
</div>
<script type="module" src="./ui/chat.js"></script>
</body>
</html>
